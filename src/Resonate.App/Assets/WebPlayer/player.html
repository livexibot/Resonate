<!doctype html>
<meta charset="utf-8">
<title>Resonate player</title>
<script>
'use strict';

// Resonate's own player for "Spotify Web API only": Spotify's Web Playback
// SDK, in a WebView2 nobody sees (Services/WebPlayerPage.cs). It shows
// nothing. It talks to OwnPlayer (Resonate.Spotify) one JSON message at a
// time; the access token it is given is used only for Spotify's player.

const post = (message) => chrome.webview.postMessage(JSON.stringify(message));
const tokenWaiters = [];
let player = null;

function loadSdk() {
  return new Promise((resolve, reject) => {
    if (window.Spotify) {
      resolve();
      return;
    }

    window.onSpotifyWebPlaybackSDKReady = () => resolve();
    const script = document.createElement('script');
    script.src = 'https://sdk.scdn.co/spotify-player.js';
    script.onerror = () => {
      script.remove();
      reject(new Error("Spotify's player could not be downloaded."));
    };
    document.head.appendChild(script);
  });
}

async function start(name, volume) {
  if (player) {
    return;
  }

  try {
    await loadSdk();
  } catch (e) {
    post({ type: 'error', kind: 'script', message: e.message });
    return;
  }

  player = new Spotify.Player({
    name,
    volume,
    getOAuthToken: (callback) => {
      tokenWaiters.push(callback);
      post({ type: 'token' });
    },
  });

  player.addListener('ready', ({ device_id }) => post({ type: 'ready', deviceId: device_id }));
  player.addListener('not_ready', ({ device_id }) => post({ type: 'notReady', deviceId: device_id }));
  for (const kind of ['initialization', 'authentication', 'account', 'playback']) {
    player.addListener(`${kind}_error`, ({ message }) => post({ type: 'error', kind, message }));
  }

  // The page was not allowed to start sound; only noted in the playback log.
  player.addListener('autoplay_failed', () => post({ type: 'autoplayFailed' }));

  // A new song, paused, resumed or moved: Resonate shows what plays at once,
  // from what Spotify's player says here (OwnPlayerReport), without asking
  // Spotify. Spotify's player reports more often than that; the rest is dropped.
  let last = { key: '', position: 0, at: 0, paused: true };
  player.addListener('player_state_changed', (state) => {
    const key = state ? `${state.paused}|${state.track_window?.current_track?.uri ?? ''}|${state.shuffle}|${state.repeat_mode}` : 'none';
    const now = performance.now();
    const expected = last.paused ? last.position : last.position + (now - last.at);
    const moved = Boolean(state) && Math.abs(state.position - expected) > 2000;
    if (key !== last.key || moved) {
      post({ type: 'state', now: describe(state) });
    }

    last = { key, position: state?.position ?? 0, at: now, paused: state?.paused ?? true };
  });

  player.connect();
}

// What plays, in the shape Resonate reads (OwnPlayerReport); null for nothing.
function describe(state) {
  const track = state?.track_window?.current_track;
  if (!state || !track) {
    return null;
  }

  return {
    paused: state.paused,
    position: state.position,
    shuffle: state.shuffle,
    repeat: state.repeat_mode,
    context: state.context?.uri ?? null,
    disallows: Object.keys(state.disallows ?? {}).filter((key) => state.disallows[key]),
    track: {
      uri: track.uri,
      id: track.id,
      name: track.name,
      duration: track.duration_ms,
      artists: (track.artists ?? []).map((artist) => ({ name: artist.name, uri: artist.uri })),
      album: {
        name: track.album?.name,
        uri: track.album?.uri,
        images: (track.album?.images ?? []).map((image) => ({ url: image.url, width: image.width, height: image.height })),
      },
    },
  };
}

// A command straight from Resonate while this player plays: no trip to Spotify's servers.
async function control(action, value) {
  if (!player) {
    return;
  }

  try {
    switch (action) {
      case 'resume':
        await player.resume();
        break;
      case 'pause':
        await player.pause();
        break;
      case 'next':
        await player.nextTrack();
        break;
      case 'previous':
        await player.previousTrack();
        break;
      case 'seek':
        await player.seek(Math.max(0, Math.round(value)));
        break;
      case 'volume':
        await player.setVolume(Math.min(1, Math.max(0, value)));
        break;
    }
  } catch {
    post({ type: 'controlFailed', kind: action });
  }
}

async function stop() {
  if (player) {
    player.disconnect();
    player = null;
  }

  post({ type: 'stopped' });
}

// Whether sound may start here without anyone clicking: a moment of silence
// played through an audio element, as Spotify's player plays its music.
async function canAutoplay() {
  const samples = 800;
  const bytes = new DataView(new ArrayBuffer(44 + (samples * 2)));
  const text = (at, value) => [...value].forEach((c, i) => bytes.setUint8(at + i, c.charCodeAt(0)));
  text(0, 'RIFF');
  bytes.setUint32(4, 36 + (samples * 2), true);
  text(8, 'WAVEfmt ');
  bytes.setUint32(16, 16, true);
  bytes.setUint16(20, 1, true);
  bytes.setUint16(22, 1, true);
  bytes.setUint32(24, 8000, true);
  bytes.setUint32(28, 16000, true);
  bytes.setUint16(32, 2, true);
  bytes.setUint16(34, 16, true);
  text(36, 'data');
  bytes.setUint32(40, samples * 2, true);
  const audio = new Audio(URL.createObjectURL(new Blob([bytes.buffer], { type: 'audio/wav' })));
  try {
    await audio.play();
    audio.pause();
    return 'ok';
  } catch (e) {
    return e.name;
  } finally {
    URL.revokeObjectURL(audio.src);
  }
}

// CI's check (--web-player-check): protected audio works here, and Spotify's
// player starts and turns down a made-up token rather than failing to start.
async function check() {
  const result = { type: 'check', widevine: 'no', sdk: 'nothing', autoplay: await canAutoplay() };
  try {
    const access = await navigator.requestMediaKeySystemAccess('com.widevine.alpha', [{
      initDataTypes: ['cenc'],
      audioCapabilities: [{ contentType: 'audio/mp4; codecs="mp4a.40.2"' }],
    }]);
    await access.createMediaKeys();
    result.widevine = 'ok';
  } catch (e) {
    result.widevine = `${e.name}: ${e.message}`;
  }

  try {
    await loadSdk();
    const probe = new Spotify.Player({ name: 'Resonate check', getOAuthToken: (callback) => callback('made-up-token') });
    result.sdk = await new Promise((resolve) => {
      for (const kind of ['initialization', 'authentication', 'account', 'playback']) {
        probe.addListener(`${kind}_error`, () => resolve(`${kind}_error`));
      }

      probe.addListener('ready', () => resolve('ready'));
      probe.connect();
      setTimeout(() => resolve('no answer'), 60000);
    });
    probe.disconnect();
  } catch (e) {
    result.sdk = e.message;
  }

  post(result);
}

chrome.webview.addEventListener('message', (event) => {
  let message;
  try {
    message = JSON.parse(event.data);
  } catch {
    return;
  }

  switch (message.type) {
    case 'start':
      start(message.name, message.volume);
      break;
    case 'token':
      for (const callback of tokenWaiters.splice(0)) {
        callback(message.token);
      }
      break;
    case 'reconnect':
      if (player) {
        player.disconnect();
        player.connect();
      }
      break;
    case 'stop':
      stop();
      break;
    case 'check':
      check();
      break;
    case 'control':
      control(message.action, Number(message.value) || 0);
      break;
  }
});

post({ type: 'loaded' });
</script>
