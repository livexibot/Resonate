# Checks every pull request (and main): formatting, the Spotify, theme and
# plugin logic's tests on Linux and on Windows, and the Windows app built
# with Native AOT, timed, photographed with demo data, installed, updated,
# running its plugins from the installed copy, and its speed and memory.
#
# The Windows app is built once; the screenshots and install checks and the
# speed and memory test then run side by side on two more machines, from
# that build. Pull requests that change only text (Markdown, docs/) skip
# everything but the first job.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces that pull request's older run.
# On main every merge keeps its own run (grouped by commit, never
# cancelled), so two merges in a row both get a result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Keep in step with the Velopack package in Directory.Packages.props and release.yml.
  VPK_VERSION: 1.2.161

jobs:
  # Fails open: a push to main, a manual run, or any trouble listing the
  # files means everything runs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: List the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "$PR" ]; then
            # Renamed files count under both names.
            if files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)'); then
              echo "$files"
              if [ -n "$files" ] && ! echo "$files" | grep -Ev '\.md$|^docs/' > /dev/null; then
                code=false
              fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Build and test: $code"

  logic:
    name: Spotify, theme and plugin logic, formatting (Linux)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check formatting
        run: |
          dotnet format src/Resonate.Spotify/Resonate.Spotify.csproj --verify-no-changes
          dotnet format src/Resonate.Windows/Resonate.Windows.csproj --verify-no-changes
          dotnet format src/Resonate.Themes/Resonate.Themes.csproj --verify-no-changes
          dotnet format src/Resonate.Plugins/Resonate.Plugins.csproj --verify-no-changes
          dotnet format src/Resonate.PluginHost/Resonate.PluginHost.csproj --verify-no-changes
          dotnet format tools/Resonate.PluginPack/Resonate.PluginPack.csproj --verify-no-changes
          dotnet format tests/Resonate.Spotify.Tests/Resonate.Spotify.Tests.csproj --verify-no-changes
          dotnet format tests/Resonate.Themes.Tests/Resonate.Themes.Tests.csproj --verify-no-changes
          dotnet format tests/Resonate.Plugins.Tests/Resonate.Plugins.Tests.csproj --verify-no-changes
          dotnet format whitespace src/Resonate.App --folder --verify-no-changes

      - name: Build the Windows integration (compile check)
        run: dotnet build src/Resonate.Windows/Resonate.Windows.csproj -c Release

      - name: Test
        run: |
          dotnet test tests/Resonate.Spotify.Tests/Resonate.Spotify.Tests.csproj -c Release
          dotnet test tests/Resonate.Themes.Tests/Resonate.Themes.Tests.csproj -c Release
          dotnet test tests/Resonate.Plugins.Tests/Resonate.Plugins.Tests.csproj -c Release

  windows-tests:
    name: Logic tests on Windows
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # One step each: PowerShell only reports the last command's failure.
      - name: Test the Spotify logic on Windows
        run: dotnet test tests/Resonate.Spotify.Tests/Resonate.Spotify.Tests.csproj -c Release

      - name: Test the theme logic on Windows
        run: dotnet test tests/Resonate.Themes.Tests/Resonate.Themes.Tests.csproj -c Release

      - name: Test the plugins on Windows
        run: dotnet test tests/Resonate.Plugins.Tests/Resonate.Plugins.Tests.csproj -c Release

  app:
    name: Windows app (build)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Plugins are not part of the app or its installer: they and their
      # helper are packed next to it, as a release does, and the app is
      # built with the catalog of those files.
      - name: Publish the plugin helper (x64, Native AOT)
        run: dotnet publish src/Resonate.PluginHost/Resonate.PluginHost.csproj -c Release -r win-x64 -o artifacts/plugin-host/win-x64

      - name: Pack the plugins
        run: dotnet run --project tools/Resonate.PluginPack -c Release -- --plugins plugins --host artifacts/plugin-host/win-x64 --runtime win-x64 --out artifacts/plugins

      # Warnings fail the build: a trimming or Native AOT warning means code
      # that may break only in the installed app. New security advisories
      # for packages (NU1901 to NU1904) stay warnings, so they cannot turn
      # an unrelated pull request red overnight.
      - name: Publish (x64, Native AOT)
        run: dotnet publish src/Resonate.App/Resonate.App.csproj -c Release -r win-x64 -p:Platform=x64 "-p:PluginCatalog=${{ github.workspace }}/artifacts/plugins/plugin-catalog.json" -o artifacts/win-x64 -bl:artifacts/publish.binlog -warnaserror -warnnotaserror:NU1901,NU1902,NU1903,NU1904

      # The app, the plugins and their helper, for the two jobs below.
      - name: Keep the build for the checks
        uses: actions/upload-artifact@v7
        with:
          name: windows-app
          path: |
            artifacts/win-x64
            artifacts/plugins
            artifacts/plugin-host/win-x64
            !artifacts/**/*.pdb
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: publish-log
          path: artifacts/publish.binlog
          if-no-files-found: ignore

  app-checks:
    name: Windows app (screenshots, install, update)
    needs: app
    if: ${{ !cancelled() && needs.app.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      # Only to keep the screenshots under refs/screenshots (see below).
      contents: write
    steps:
      - uses: actions/checkout@v7

      # For vpk, which packs the installer in the install test.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v7
        with:
          name: windows-app
          path: artifacts

      - name: Measure start-up time
        shell: pwsh
        run: |
          $times = @()
          for ($i = 1; $i -le 3; $i++) {
            $file = Join-Path $env:RUNNER_TEMP "startup-$i.txt"
            $process = Start-Process -FilePath artifacts/win-x64/Resonate.exe -ArgumentList '--demo', '--startup-benchmark', $file -PassThru
            if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Resonate did not show a window within a minute.' }
            $times += [int](Get-Content $file)
          }
          $line = "Start-up to first frame (demo data, cold then warm): $($times -join ' ms, ') ms"
          Write-Output $line
          "### Start-up time`n`n$line" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          # The owner's target is a usable window in under a second. The best
          # warm start is the steadiest number on a shared machine.
          $best = ($times | Select-Object -Skip 1 | Measure-Object -Minimum).Minimum
          if ($best -gt 1000) { throw "Resonate took $best ms to show its window, over the one-second target." }

      - name: Take screenshots
        shell: pwsh
        run: |
          $folder = Join-Path $env:GITHUB_WORKSPACE 'artifacts/screenshots'
          $process = Start-Process -FilePath artifacts/win-x64/Resonate.exe -ArgumentList '--screenshots', $folder -PassThru
          # The tour waits about two minutes in all and grows with every
          # preset; on a timeout the list shows how far it got.
          $finished = $process.WaitForExit(240000)
          Get-ChildItem $folder | Sort-Object LastWriteTime | Format-Table Name, Length, LastWriteTime
          if (-not $finished) { $process.Kill(); throw 'The screenshot tour did not finish.' }

      # Artifacts need a GitHub login to download, so the screenshots are also
      # kept as a commit under refs/screenshots/pr-<number> (a hidden ref, not
      # a branch). Pull request descriptions link to them, and Claude's cloud
      # sessions, which cannot download artifacts, fetch them with git.
      - name: Keep screenshots for the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          $ref = 'refs/screenshots/pr-${{ github.event.pull_request.number }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $env:GIT_INDEX_FILE = Join-Path $env:RUNNER_TEMP 'screenshots.index'
          Get-ChildItem artifacts/screenshots -Filter '*.png' | ForEach-Object {
            $blob = git hash-object -w $_.FullName
            git update-index --add --cacheinfo "100644,$blob,$($_.Name)"
          }
          $tree = git write-tree
          $message = 'Screenshots of ${{ github.event.pull_request.head.sha }}'
          $parent = (git ls-remote origin $ref) -split '\s+' | Select-Object -First 1
          if ($parent) {
            git fetch --depth=1 origin $ref
            $commit = git commit-tree $tree -p $parent -m $message
          } else {
            $commit = git commit-tree $tree -m $message
          }
          git push origin "${commit}:${ref}"
          "Screenshots: ${{ github.server_url }}/${{ github.repository }}/tree/$commit" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # The same packaging as a release, then a silent install and a start of
      # the installed copy, so a broken installer shows up here rather than
      # after a release. A newer version is packed too, for the update test.
      - name: Install test
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version $env:VPK_VERSION
          $feed = Join-Path $env:RUNNER_TEMP 'feed'
          $pack = @('--packId', 'Resonate', '--packDir', 'artifacts/win-x64', '--mainExe', 'Resonate.exe',
                    '--packTitle', 'Resonate', '--packAuthors', 'livexibot', '--icon', 'src/Resonate.App/Assets/Resonate.ico',
                    '--runtime', 'win-x64', '--channel', 'win-x64', '--noPortable', '--outputDir', $feed)
          vpk pack @pack --packVersion 0.0.1-ci
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
          Get-ChildItem $feed | Format-Table Name, Length

          $setup = Get-ChildItem $feed -Filter '*Setup.exe' | Select-Object -First 1
          # Velopack leaves debug symbols (.pdb) out by default.
          $size = '{0:N1} MB installer, {1:N1} MB installed' -f ($setup.Length / 1MB), ((Get-ChildItem artifacts/win-x64 -Recurse -File -Exclude '*.pdb' | Measure-Object Length -Sum).Sum / 1MB)
          Write-Output "Size: $size"
          "### Size`n`n$size" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $process = Start-Process $setup.FullName -ArgumentList '--silent' -PassThru
          if (-not $process.WaitForExit(300000)) { throw 'Setup did not finish within five minutes.' }
          if ($process.ExitCode -ne 0) { throw "Setup failed with exit code $($process.ExitCode)." }
          $installed = Join-Path $env:LOCALAPPDATA 'Resonate/current/Resonate.exe'
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Resonate/Resonate.exe'))) { throw 'Setup did not create the Resonate shortcut target.' }
          if (-not (Test-Path $installed)) { throw 'Setup did not install Resonate.' }

          $startup = Join-Path $env:RUNNER_TEMP 'installed-startup.txt'
          $process = Start-Process $installed -ArgumentList '--demo', '--startup-benchmark', $startup -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'The installed Resonate did not start.' }
          Write-Output "Installed copy: first frame after $(Get-Content $startup) ms"

          vpk pack @pack --packVersion 0.0.2-ci
          if ($LASTEXITCODE -ne 0) { throw 'Packaging the second version failed.' }

      # The installed copy downloads the helper and every plugin from the
      # packed files (checking each against its catalog, as from a release),
      # runs them, turns them off again, and reports the helper's memory.
      # It runs before the update test: Velopack installs a downloaded update
      # on the next start, which would replace the copy being checked.
      - name: Plugin check (installed copy)
        shell: pwsh
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'Resonate/current/Resonate.exe'
          $feed = (Resolve-Path artifacts/plugins).Path
          $result = Join-Path $env:RUNNER_TEMP 'plugin-result.txt'
          $process = Start-Process $installed -ArgumentList '--plugin-check', $feed, $result -PassThru
          if (-not $process.WaitForExit(180000)) { $process.Kill(); throw 'The plugin check did not finish.' }
          if (-not (Test-Path $result)) { throw "The plugin check wrote no result (exit code $($process.ExitCode))." }
          $outcome = (Get-Content $result -Raw).Trim()
          $helper = [math]::Round((Get-Item artifacts/plugins/resonate-plugin-host-win-x64.zip).Length / 1MB, 1)
          $unpacked = [math]::Round((Get-ChildItem artifacts/plugin-host/win-x64 -Recurse -File | Where-Object { $_.Extension -ne '.pdb' } | Measure-Object Length -Sum).Sum / 1MB, 1)
          $line = "$outcome. The helper downloads as $helper MB ($unpacked MB unpacked), only when the first plugin is turned on."
          Write-Output $line
          "### Plugins`n`n$line" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if (-not $outcome.StartsWith('OK ')) { throw "The plugin check failed: $outcome" }

      # Resonate's own player for "Spotify Web API only" (Spotify's Web
      # Playback SDK in a hidden WebView2) opens in the installed copy:
      # protected audio works, and Spotify's player starts and turns down a
      # made-up token. CI has no Spotify account, so nothing plays.
      - name: Web player check (installed copy)
        shell: pwsh
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'Resonate/current/Resonate.exe'
          $result = Join-Path $env:RUNNER_TEMP 'web-player-result.txt'
          $process = Start-Process $installed -ArgumentList '--web-player-check', $result -PassThru
          $finished = $process.WaitForExit(180000)
          # Each step it took (timed), and the outcome (OK, FAIL or Error).
          if (Test-Path $result) { Get-Content $result | ForEach-Object { Write-Output "  $_" } }
          if (-not $finished) {
            Get-Process Resonate, msedgewebview2 -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, CPU, WorkingSet64 | Out-String | Write-Output
            $process.Kill()
            throw 'The web player check did not finish.'
          }
          if (-not (Test-Path $result)) { throw "The web player check wrote no result (exit code $($process.ExitCode))." }
          $outcome = (Get-Content $result | Where-Object { $_ -match '^(OK|FAIL|Error) ' } | Select-Object -Last 1)
          if (-not $outcome) { throw 'The web player check wrote no outcome.' }
          $outcome = $outcome.Trim()
          Write-Output "Web player: $outcome"
          "### Web player`n`n$outcome" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if (-not $outcome.StartsWith('OK ')) { throw "The web player check failed: $outcome" }

      # The installed copy finds the newer version packed above and downloads
      # it, so a broken updater shows up here rather than after a release.
      - name: Update test
        shell: pwsh
        run: |
          $installed = Join-Path $env:LOCALAPPDATA 'Resonate/current/Resonate.exe'
          $feed = Join-Path $env:RUNNER_TEMP 'feed'
          $result = Join-Path $env:RUNNER_TEMP 'update-result.txt'
          $process = Start-Process $installed -ArgumentList '--update-check', $feed, $result -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'The update check did not finish.' }
          $outcome = Get-Content $result
          Write-Output "Update check: $outcome"
          if ($outcome -ne 'ReadyToRestart 0.0.2-ci') { throw "The installed copy did not download the new version ($outcome)." }

      # Last, so a broken tour still keeps its screenshots and runs the
      # install test above, yet fails the pull request.
      - name: Check the screenshot tour
        shell: pwsh
        run: |
          $folder = Join-Path $env:GITHUB_WORKSPACE 'artifacts/screenshots'
          $errors = Join-Path $folder 'tour-errors.txt'
          if (Test-Path $errors) { Get-Content $errors; throw 'The screenshot tour hit the errors above.' }
          if (-not (Get-ChildItem $folder -Filter '*-sign-in.png')) { throw 'The screenshot tour stopped before its last screenshot (sign-in).' }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: artifacts/screenshots
          if-no-files-found: warn

  app-perf:
    name: Windows app (speed and memory)
    needs: app
    if: ${{ !cancelled() && needs.app.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-app
          path: artifacts

      # Speed and memory with a heavy listener's library (10,000 liked songs):
      # every page, scrolling, switching looks, what the app costs while
      # nobody touches it, and pages or memory that are never given back.
      # The results are printed here and in the run's summary.
      - name: Measure speed and memory
        shell: pwsh
        run: |
          # Windows' "Animation effects" on, as on the owner's PC, so page and
          # look-switching animations and the moving cover are measured too.
          Add-Type -Namespace Win32 -Name Spi -MemberDefinition '[DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint action, uint param, IntPtr value, uint flags);'
          [Win32.Spi]::SystemParametersInfo(0x1043, 0, [IntPtr]1, 3) | Out-Null
          # One start first, so the measured run does not pay for this
          # machine opening the freshly downloaded files for the first time.
          $warmup = Join-Path $env:RUNNER_TEMP 'warm-up.txt'
          $process = Start-Process -FilePath artifacts/win-x64/Resonate.exe -ArgumentList '--demo', '--startup-benchmark', $warmup -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Resonate did not show a window within a minute.' }
          $folder = Join-Path $env:GITHUB_WORKSPACE 'artifacts/perf'
          $process = Start-Process -FilePath artifacts/win-x64/Resonate.exe -ArgumentList '--perf', $folder -PassThru
          $report = Join-Path $folder 'perf.md'
          if (-not $process.WaitForExit(420000)) {
            $process.Kill()
            if (Test-Path $report) { Get-Content $report }
            throw 'The speed test did not finish within seven minutes.'
          }
          if (-not (Test-Path $report)) { throw 'The speed test wrote no results.' }
          Get-Content $report
          Get-Content $report | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content (Join-Path $folder 'perf.json')
          $errors = Join-Path $folder 'perf-errors.txt'
          if (Test-Path $errors) { Get-Content $errors; throw 'The speed test found the problems above.' }

      - name: Upload speed and memory results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf
          path: artifacts/perf
          if-no-files-found: ignore
