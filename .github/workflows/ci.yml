# Checks every pull request (and main): formatting, the Spotify and theme
# logic's tests on Linux, and the Windows app built with Native AOT, timed,
# and photographed with demo data.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Keep in step with the Velopack package in Directory.Packages.props and release.yml.
  VPK_VERSION: 1.2.161

jobs:
  logic:
    name: Spotify and theme logic, formatting (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check formatting
        run: |
          dotnet format src/Resonate.Spotify/Resonate.Spotify.csproj --verify-no-changes
          dotnet format src/Resonate.Windows/Resonate.Windows.csproj --verify-no-changes
          dotnet format src/Resonate.Themes/Resonate.Themes.csproj --verify-no-changes
          dotnet format tests/Resonate.Spotify.Tests/Resonate.Spotify.Tests.csproj --verify-no-changes
          dotnet format tests/Resonate.Themes.Tests/Resonate.Themes.Tests.csproj --verify-no-changes
          dotnet format whitespace src/Resonate.App --folder --verify-no-changes

      - name: Build the Windows integration (compile check)
        run: dotnet build src/Resonate.Windows/Resonate.Windows.csproj -c Release

      - name: Test
        run: |
          dotnet test tests/Resonate.Spotify.Tests/Resonate.Spotify.Tests.csproj -c Release
          dotnet test tests/Resonate.Themes.Tests/Resonate.Themes.Tests.csproj -c Release

  app:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      # Only to keep the screenshots under refs/screenshots (see below).
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # One step each: PowerShell only reports the last command's failure.
      - name: Test the Spotify logic on Windows
        run: dotnet test tests/Resonate.Spotify.Tests/Resonate.Spotify.Tests.csproj -c Release

      - name: Test the theme logic on Windows
        run: dotnet test tests/Resonate.Themes.Tests/Resonate.Themes.Tests.csproj -c Release

      # Warnings fail the build: a trimming or Native AOT warning means code
      # that may break only in the installed app. New security advisories
      # for packages (NU1901 to NU1904) stay warnings, so they cannot turn
      # an unrelated pull request red overnight.
      - name: Publish (x64, Native AOT)
        run: dotnet publish src/Resonate.App/Resonate.App.csproj -c Release -r win-x64 -p:Platform=x64 -o artifacts/win-x64 -bl:artifacts/publish.binlog -warnaserror -warnnotaserror:NU1901,NU1902,NU1903,NU1904

      - name: Measure start-up time
        shell: pwsh
        run: |
          $times = @()
          for ($i = 1; $i -le 3; $i++) {
            $file = Join-Path $env:RUNNER_TEMP "startup-$i.txt"
            $process = Start-Process -FilePath artifacts/win-x64/Resonate.exe -ArgumentList '--demo', '--startup-benchmark', $file -PassThru
            if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Resonate did not show a window within a minute.' }
            $times += [int](Get-Content $file)
          }
          $line = "Start-up to first frame (demo data, cold then warm): $($times -join ' ms, ') ms"
          Write-Output $line
          "### Start-up time`n`n$line" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          # The owner's target is a usable window in under a second. The best
          # warm start is the steadiest number on a shared machine.
          $best = ($times | Select-Object -Skip 1 | Measure-Object -Minimum).Minimum
          if ($best -gt 1000) { throw "Resonate took $best ms to show its window, over the one-second target." }

      - name: Take screenshots
        shell: pwsh
        run: |
          $folder = Join-Path $env:GITHUB_WORKSPACE 'artifacts/screenshots'
          $process = Start-Process -FilePath artifacts/win-x64/Resonate.exe -ArgumentList '--screenshots', $folder -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'The screenshot tour did not finish.' }
          Get-ChildItem $folder | Format-Table Name, Length

      # Artifacts need a GitHub login to download, so the screenshots are also
      # kept as a commit under refs/screenshots/pr-<number> (a hidden ref, not
      # a branch). Pull request descriptions link to them, and Claude's cloud
      # sessions, which cannot download artifacts, fetch them with git.
      - name: Keep screenshots for the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        run: |
          $ref = 'refs/screenshots/pr-${{ github.event.pull_request.number }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $env:GIT_INDEX_FILE = Join-Path $env:RUNNER_TEMP 'screenshots.index'
          Get-ChildItem artifacts/screenshots -Filter '*.png' | ForEach-Object {
            $blob = git hash-object -w $_.FullName
            git update-index --add --cacheinfo "100644,$blob,$($_.Name)"
          }
          $tree = git write-tree
          $message = 'Screenshots of ${{ github.event.pull_request.head.sha }}'
          $parent = (git ls-remote origin $ref) -split '\s+' | Select-Object -First 1
          if ($parent) {
            git fetch --depth=1 origin $ref
            $commit = git commit-tree $tree -p $parent -m $message
          } else {
            $commit = git commit-tree $tree -m $message
          }
          git push origin "${commit}:${ref}"
          "Screenshots: ${{ github.server_url }}/${{ github.repository }}/tree/$commit" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # The same packaging as a release, then a silent install, a start of the
      # installed copy, and an update to a newer local version, so a broken
      # installer or updater shows up here rather than after a release.
      - name: Install and update test
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version $env:VPK_VERSION
          $feed = Join-Path $env:RUNNER_TEMP 'feed'
          $pack = @('--packId', 'Resonate', '--packDir', 'artifacts/win-x64', '--mainExe', 'Resonate.exe',
                    '--packTitle', 'Resonate', '--packAuthors', 'livexibot', '--icon', 'src/Resonate.App/Assets/Resonate.ico',
                    '--runtime', 'win-x64', '--channel', 'win-x64', '--outputDir', $feed)
          vpk pack @pack --packVersion 0.0.1-ci
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
          Get-ChildItem $feed | Format-Table Name, Length

          $setup = Get-ChildItem $feed -Filter '*Setup.exe' | Select-Object -First 1
          # Velopack leaves debug symbols (.pdb) out by default.
          $size = '{0:N1} MB installer, {1:N1} MB installed' -f ($setup.Length / 1MB), ((Get-ChildItem artifacts/win-x64 -Recurse -File -Exclude '*.pdb' | Measure-Object Length -Sum).Sum / 1MB)
          Write-Output "Size: $size"
          "### Size`n`n$size" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          $process = Start-Process $setup.FullName -ArgumentList '--silent' -PassThru
          if (-not $process.WaitForExit(300000)) { throw 'Setup did not finish within five minutes.' }
          if ($process.ExitCode -ne 0) { throw "Setup failed with exit code $($process.ExitCode)." }
          $installed = Join-Path $env:LOCALAPPDATA 'Resonate/current/Resonate.exe'
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'Resonate/Resonate.exe'))) { throw 'Setup did not create the Resonate shortcut target.' }
          if (-not (Test-Path $installed)) { throw 'Setup did not install Resonate.' }

          $startup = Join-Path $env:RUNNER_TEMP 'installed-startup.txt'
          $process = Start-Process $installed -ArgumentList '--demo', '--startup-benchmark', $startup -PassThru
          if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'The installed Resonate did not start.' }
          Write-Output "Installed copy: first frame after $(Get-Content $startup) ms"

          vpk pack @pack --packVersion 0.0.2-ci
          if ($LASTEXITCODE -ne 0) { throw 'Packaging the second version failed.' }
          $result = Join-Path $env:RUNNER_TEMP 'update-result.txt'
          $process = Start-Process $installed -ArgumentList '--update-check', $feed, $result -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'The update check did not finish.' }
          $outcome = Get-Content $result
          Write-Output "Update check: $outcome"
          if ($outcome -ne 'ReadyToRestart 0.0.2-ci') { throw "The installed copy did not download the new version ($outcome)." }

      # Speed and memory with a heavy listener's library (10,000 liked songs):
      # every page, scrolling, switching looks, what the app costs while
      # nobody touches it, and pages or memory that are never given back.
      # The results are printed here and in the run's summary.
      - name: Measure speed and memory
        shell: pwsh
        run: |
          # Windows' "Animation effects" on, as on the owner's PC, so page and
          # look-switching animations and the moving cover are measured too.
          Add-Type -Namespace Win32 -Name Spi -MemberDefinition '[DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint action, uint param, IntPtr value, uint flags);'
          [Win32.Spi]::SystemParametersInfo(0x1043, 0, [IntPtr]1, 3) | Out-Null
          $folder = Join-Path $env:GITHUB_WORKSPACE 'artifacts/perf'
          $process = Start-Process -FilePath artifacts/win-x64/Resonate.exe -ArgumentList '--perf', $folder -PassThru
          $report = Join-Path $folder 'perf.md'
          if (-not $process.WaitForExit(300000)) {
            $process.Kill()
            if (Test-Path $report) { Get-Content $report }
            throw 'The speed test did not finish within five minutes.'
          }
          if (-not (Test-Path $report)) { throw 'The speed test wrote no results.' }
          Get-Content $report
          Get-Content $report | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content (Join-Path $folder 'perf.json')
          $errors = Join-Path $folder 'perf-errors.txt'
          if (Test-Path $errors) { Get-Content $errors; throw 'The speed test found the problems above.' }

      # Last, so a broken tour still keeps its screenshots and runs the
      # install test above, yet fails the pull request.
      - name: Check the screenshot tour
        shell: pwsh
        run: |
          $folder = Join-Path $env:GITHUB_WORKSPACE 'artifacts/screenshots'
          $errors = Join-Path $folder 'tour-errors.txt'
          if (Test-Path $errors) { Get-Content $errors; throw 'The screenshot tour hit the errors above.' }
          if (-not (Get-ChildItem $folder -Filter '*-sign-in.png')) { throw 'The screenshot tour stopped before its last screenshot (sign-in).' }

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: artifacts/screenshots
          if-no-files-found: warn

      - name: Upload speed and memory results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf
          path: artifacts/perf
          if-no-files-found: ignore

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: publish-log
          path: artifacts/publish.binlog
          if-no-files-found: ignore

  app-arm64:
    name: Windows app (arm64 build)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish (arm64, Native AOT)
        run: dotnet publish src/Resonate.App/Resonate.App.csproj -c Release -r win-arm64 -p:Platform=ARM64 -o artifacts/win-arm64
