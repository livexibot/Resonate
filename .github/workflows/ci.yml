# Checks every pull request (and main): formatting, the Spotify logic's
# tests on Linux, and the Windows app built with Native AOT, timed, and
# photographed with demo data.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  logic:
    name: Spotify logic and formatting (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check formatting
        run: |
          dotnet format src/Resonate.Spotify/Resonate.Spotify.csproj --verify-no-changes
          dotnet format src/Resonate.Windows/Resonate.Windows.csproj --verify-no-changes
          dotnet format tests/Resonate.Spotify.Tests/Resonate.Spotify.Tests.csproj --verify-no-changes
          dotnet format whitespace src/Resonate.App --folder --verify-no-changes

      - name: Build the Windows integration (compile check)
        run: dotnet build src/Resonate.Windows/Resonate.Windows.csproj -c Release

      - name: Test
        run: dotnet test tests/Resonate.Spotify.Tests/Resonate.Spotify.Tests.csproj -c Release

  app:
    name: Windows app
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test on Windows
        run: dotnet test tests/Resonate.Spotify.Tests/Resonate.Spotify.Tests.csproj -c Release

      - name: Publish (x64, Native AOT)
        run: dotnet publish src/Resonate.App/Resonate.App.csproj -c Release -r win-x64 -p:Platform=x64 -o artifacts/win-x64 -bl:artifacts/publish.binlog

      - name: Measure start-up time
        shell: pwsh
        run: |
          $times = @()
          for ($i = 1; $i -le 3; $i++) {
            $file = Join-Path $env:RUNNER_TEMP "startup-$i.txt"
            $process = Start-Process -FilePath artifacts/win-x64/Resonate.exe -ArgumentList '--demo', '--startup-benchmark', $file -PassThru
            if (-not $process.WaitForExit(60000)) { $process.Kill(); throw 'Resonate did not show a window within a minute.' }
            $times += [int](Get-Content $file)
          }
          $line = "Start-up to first frame (demo data, cold then warm): $($times -join ' ms, ') ms"
          Write-Output $line
          "### Start-up time`n`n$line" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      - name: Take screenshots
        shell: pwsh
        run: |
          $folder = Join-Path $env:GITHUB_WORKSPACE 'artifacts/screenshots'
          $process = Start-Process -FilePath artifacts/win-x64/Resonate.exe -ArgumentList '--screenshots', $folder -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'The screenshot tour did not finish.' }
          Get-ChildItem $folder | Format-Table Name, Length
          # Previews as text, for reviewers that can read this log but not download artifacts.
          Write-Output '::group::Screenshot previews (base64 JPEG)'
          Get-ChildItem $folder -Filter '*.preview.jpg' | ForEach-Object {
            "BEGIN-SCREENSHOT $($_.Name)"
            [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            "END-SCREENSHOT $($_.Name)"
          }
          Write-Output '::endgroup::'

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: artifacts/screenshots
          if-no-files-found: warn

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: publish-log
          path: artifacts/publish.binlog
          if-no-files-found: ignore
