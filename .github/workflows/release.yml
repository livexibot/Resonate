# Builds the Windows installer for a release and attaches it, with the
# update feed that installed copies of Resonate read (Velopack). Called by
# the Release workflow when a release is created; can also be re-run for
# an existing tag from the Actions tab.
#
# Only for ordinary Windows PCs (x64), the owner's choice: no arm64 build
# and no portable zip. A release holds the installer, the update packages
# (full, and a small delta from the previous release) and the update feed.
# Every plugin is built into the app (since 0.20.0), so nothing else.
name: Build installer

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VPK_VERSION: 1.2.161

jobs:
  build:
    name: Installer (win-x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read the version from the tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.tag }}'.TrimStart('v')
          "value=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Publish (Native AOT)
        run: dotnet publish src/Resonate.App/Resonate.App.csproj -c Release -r win-x64 -p:Platform=x64 -p:Version=${{ steps.version.outputs.value }} -o publish

      - name: Package and attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install -g vpk --version $env:VPK_VERSION
          $repo = "https://github.com/${{ github.repository }}"
          # The previous release lets Velopack build a small delta update.
          vpk download github --repoUrl $repo --channel win-x64 --token $env:GH_TOKEN
          vpk pack --packId Resonate --packVersion ${{ steps.version.outputs.value }} --packDir publish --mainExe Resonate.exe --packTitle Resonate --packAuthors livexibot --icon src/Resonate.App/Assets/Resonate.ico --runtime win-x64 --channel win-x64 --noPortable
          vpk upload github --repoUrl $repo --channel win-x64 --tag ${{ inputs.tag }} --merge --publish --token $env:GH_TOKEN
