# Builds the Windows installer for a release and attaches it, with the
# update feed that installed copies of Resonate read (Velopack), and the
# optional plugins and their helper, which the app downloads only when one
# is turned on. Called by the Release workflow when a release is created;
# can also be re-run for an existing tag from the Actions tab.
#
# Only for ordinary Windows PCs (x64), the owner's choice: no arm64 build
# and no portable zip. A release holds the installer, the update packages
# (full, and a small delta from the previous release), the update feed,
# and the plugins with their helper.
name: Build installer

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VPK_VERSION: 1.2.161

jobs:
  build:
    name: Installer (win-x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read the version from the tag
        id: version
        shell: pwsh
        run: |
          $version = '${{ inputs.tag }}'.TrimStart('v')
          "value=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      # The catalog built into the app pins every file below by its SHA-256,
      # and points at this release's downloads.
      - name: Publish and pack the plugins
        shell: pwsh
        run: |
          dotnet publish src/Resonate.PluginHost/Resonate.PluginHost.csproj -c Release -r win-x64 -p:Version=${{ steps.version.outputs.value }} -o plugin-host
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the plugin helper failed.' }
          $source = "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/"
          dotnet run --project tools/Resonate.PluginPack -c Release -- --plugins plugins --host plugin-host --runtime win-x64 --source $source --out plugins-out
          if ($LASTEXITCODE -ne 0) { throw 'Packing the plugins failed.' }

      - name: Publish (Native AOT)
        run: dotnet publish src/Resonate.App/Resonate.App.csproj -c Release -r win-x64 -p:Platform=x64 -p:Version=${{ steps.version.outputs.value }} "-p:PluginCatalog=${{ github.workspace }}/plugins-out/plugin-catalog.json" -o publish

      # Before the update feed, so an updated copy never looks for plugins
      # that are not there yet. Plugins are packed byte for byte the same
      # every time (fixed dates, no compression), so a re-run for the same
      # tag finds them there already and checks they match instead of
      # replacing them.
      - name: Attach the plugins
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ inputs.tag }}'
          $existing = (gh release view $tag --repo ${{ github.repository }} --json assets | ConvertFrom-Json).assets.name
          $check = Join-Path $env:RUNNER_TEMP 'plugin-check'
          New-Item -ItemType Directory -Force $check | Out-Null
          foreach ($file in Get-ChildItem plugins-out -Filter '*.zip') {
            if ($existing -contains $file.Name) {
              gh release download $tag --repo ${{ github.repository }} --pattern $file.Name --dir $check --clobber
              $theirs = (Get-FileHash (Join-Path $check $file.Name) -Algorithm SHA256).Hash
              $ours = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
              if ($theirs -ne $ours) { throw "$($file.Name) differs from the copy already in the release." }
              Write-Output "$($file.Name) is already attached."
            } else {
              gh release upload $tag $file.FullName --repo ${{ github.repository }}
              if ($LASTEXITCODE -ne 0) { throw "Attaching $($file.Name) failed." }
            }
          }

      - name: Package and attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install -g vpk --version $env:VPK_VERSION
          $repo = "https://github.com/${{ github.repository }}"
          # The previous release lets Velopack build a small delta update.
          vpk download github --repoUrl $repo --channel win-x64 --token $env:GH_TOKEN
          vpk pack --packId Resonate --packVersion ${{ steps.version.outputs.value }} --packDir publish --mainExe Resonate.exe --packTitle Resonate --packAuthors livexibot --icon src/Resonate.App/Assets/Resonate.ico --runtime win-x64 --channel win-x64 --noPortable
          vpk upload github --repoUrl $repo --channel win-x64 --tag ${{ inputs.tag }} --merge --publish --token $env:GH_TOKEN
