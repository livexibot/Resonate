# Keeps one open "release" pull request that raises the version and writes
# CHANGELOG.md from the merged pull request titles. Merging it tags vX.Y.Z,
# creates the GitHub release, and builds the installer for it.
#
# Releases and pull requests made with the default GITHUB_TOKEN do not start
# other workflows, so the installer build is called from here directly.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  installer:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
